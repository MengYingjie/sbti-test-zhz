      position: relative;
    }

      left: 0;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .back-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .gallery-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, #ffffff, #fffdfb);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 12px rgba(139, 35, 32, 0.03);
    }

    .gallery-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow);
    }

    .gallery-img-box {
      width: 100%;
      height: 240px;
      background: #fdfaf7;
      position: relative;
      border-bottom: 1px solid var(--line);
    }

    .gallery-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-content {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .gallery-title {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-strong);
      margin-bottom: 6px;
    }

    .gallery-code {
      display: none;
    }

    .gallery-intro {
      font-size: 15px;
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 12px;
      font-style: italic;
    }

    .gallery-desc {
      font-size: 14px;
      color: #3e2e26;
      line-height: 1.8;
